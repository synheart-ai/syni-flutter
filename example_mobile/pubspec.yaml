name: syni_mobile_example
description: Mobile example app for syni-dart FFI runtime wrapper
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Use local syni package
  syni:
    path: ../
  
  # Path provider for accessing model files
  path_provider: ^2.1.1
  
  # File picker for selecting model
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # Add model to assets (optional - can also download)
  # assets:
  #   - assets/google_gemma-3-1b-it-Q4_K_M.gguf
