group 'com.synheart.syni'
version '1.0.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.synheart.syni'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        // Native libsyni_ffi.so is provisioned INTO THE CONSUMER APP by
        // `synheart install syni`, at
        // <host-app>/synheart/vendor/syni-runtime/android/jniLibs/<abi>/ (the
        // CLI vendors every package to synheart/vendor/<package>/; the iOS
        // podspec reads the same directory). When this module builds as a
        // subproject of a Flutter app, rootProject.projectDir is that app's
        // android/ folder, so parentFile = the app root.
        // Override via `syni.runtime.android.jniLibs` in gradle.properties.
        def syniJniLibs = project.findProperty('syni.runtime.android.jniLibs') ?:
            new File(rootProject.projectDir.parentFile,
                'synheart/vendor/syni-runtime/android/jniLibs').absolutePath
        if (new File(syniJniLibs).isDirectory()) {
            main.jniLibs.srcDirs += [syniJniLibs]
        } else {
            logger.warn("syni: no Syni runtime at ${syniJniLibs}; run " +
                "`synheart install syni` in the app root, or set " +
                "syni.runtime.android.jniLibs. Without it the app cannot load " +
                "libsyni_ffi.so.")
        }
    }

    defaultConfig {
        minSdk 26
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // No native SDK dependency. Inference runs in Dart via dart:ffi against
    // libsyni_ffi.so, packaged from `android/src/main/jniLibs/<abi>/`. The
    // previous `implementation project(':syni-sdk')` line was removed when
    // this package moved to a Dart-FFI-first architecture.
}
