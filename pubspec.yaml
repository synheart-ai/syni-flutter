name: syni
description: Flutter SDK for Syni - a unified API for AI-powered features delegating to native SDKs (syni-swift, syni-kotlin) via platform channels.
version: 1.0.0
homepage: https://github.com/synheart/syni-dart
repository: https://github.com/synheart/syni-dart
issue_tracker: https://github.com/synheart/syni-dart/issues

environment:
  # 3.1.0+: NativeCallable.isolateLocal (used by runtime streaming).
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path_provider: ^2.1.0
  http: ^1.2.0
  # Model download SHA-256 verification.
  crypto: ^3.0.3
  # BehaviorSubject for the install-state stream in SyniAgent.
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.synheart.syni
        pluginClass: SyniPlugin
      ios:
        pluginClass: SyniPlugin
